<ion-item class="space-list-item" lines="none">
  <div class="space-list-item__media" slot="start">
    @if (space.image) {
      <img
        class="space-list-item__image"
        [src]="space.image"
        [alt]="'Foto di ' + space.name"
        loading="lazy"
      />
    } @else {
      <div class="space-list-item__placeholder" aria-hidden="true"></div>
    }
  </div>

  <div class="space-list-item__content">
    <ion-badge class="space-list-item__type">
      {{ space.type }}
    </ion-badge>

    <h3 class="space-list-item__name">
      {{ space.name }}
    </h3>

    <p class="space-list-item__details">
      {{ space.building }}
      <span aria-hidden="true">·</span>
      piano {{ space.floor }}
      <span aria-hidden="true">·</span>
      {{ space.seats }}
      {{ space.seats === 1 ? "posto" : "posti" }}
    </p>

    <p
      class="space-list-item__availability"
      [class.space-list-item__availability--unavailable]="unavailable"
    >
      {{ availabilityLabel }}
    </p>
  </div>

  <div class="space-list-item__actions" slot="end">
    <ion-button
      class="space-list-item__favorite"
      fill="outline"
      [attr.aria-label]="
        favorite
          ? 'Rimuovi ' + space.name + ' dai preferiti'
          : 'Aggiungi ' + space.name + ' ai preferiti'
      "
      [attr.aria-pressed]="favorite"
      (click)="toggleFavorite()"
    >
      <ion-icon
        slot="icon-only"
        [name]="favorite ? 'heart' : 'heart-outline'"
        aria-hidden="true"
      ></ion-icon>
    </ion-button>

    <ion-button
      class="space-list-item__action"
      fill="clear"
      [attr.aria-label]="'Apri ' + space.name"
      (click)="openSpace()"
    >
      <ion-icon
        slot="icon-only"
        name="arrow-forward-outline"
        aria-hidden="true"
      ></ion-icon>
    </ion-button>
  </div>
</ion-item>
