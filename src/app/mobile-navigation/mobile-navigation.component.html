<nav class="mobile-navigation" aria-label="Navigazione mobile">
  @for (item of navigation; track item.route) {
    <ion-button
      fill="clear"
      class="mobile-navigation__link"
      [routerLink]="item.route"
      routerLinkActive="mobile-navigation__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      <span class="mobile-navigation__content">
        <ion-icon [name]="item.icon" aria-hidden="true"></ion-icon>
        <span>{{ item.label }}</span>
      </span>
    </ion-button>
  }
</nav>
