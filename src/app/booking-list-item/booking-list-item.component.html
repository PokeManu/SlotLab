<ion-card class="booking-item">
  <div class="booking-item__time" aria-label="Orario della prenotazione">
    <span>{{ booking.startTime }}</span>
    <span aria-hidden="true">–</span>
    <span>{{ booking.endTime }}</span>
  </div>

  <div class="booking-item__space-icon" aria-hidden="true">
    <ion-icon [name]="spaceIcon"></ion-icon>
  </div>

  <div class="booking-item__information">
    <h3>{{ booking.spaceName }}</h3>

    <p>{{ booking.building }} · piano {{ booking.floor }}</p>

    <p class="booking-item__participants">
      <ion-icon name="people-outline" aria-hidden="true"></ion-icon>
      <span>
        {{ booking.participants }}
        {{ booking.participants === 1 ? "partecipante" : "partecipanti" }}
      </span>
    </p>
  </div>

  <ion-badge class="booking-item__status" [attr.data-status]="booking.status">
    {{ statusLabel }}
  </ion-badge>

  <div class="booking-item__actions">
    <ion-button
      class="booking-item__check-in"
      [routerLink]="['/bookings', booking.id]"
    >
      Dettaglio e partecipanti
    </ion-button>

    <ion-button
      class="booking-item__cancel"
      type="button"
      fill="clear"
      (click)="cancelBooking()"
    >
      Annulla
    </ion-button>
  </div>
</ion-card>
