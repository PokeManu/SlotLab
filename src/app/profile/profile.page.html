<ion-content [fullscreen]="true">
  <main class="profile">
    <h1 class="profile__title">Profilo</h1>

    <section class="profile__identity" aria-labelledby="profile-user-name">
      <label
        class="profile__avatar"
        [class.profile__avatar--disabled]="photoSaving"
        [attr.aria-label]="photoSaving ? 'Salvataggio immagine in corso' : 'Cambia immagine del profilo'"
      >
        @if (profilePhotoUrl) {
        <img
          [src]="profilePhotoUrl"
          [alt]="'Foto profilo di ' + user.fullName"
        />
        } @else {
        <span aria-hidden="true">{{user.initials}}</span>
        }
        <input
          class="profile__photo-input"
          type="file"
          accept="image/jpeg,image/png,image/webp"
          [disabled]="photoSaving"
          (change)="selectProfilePhoto($event)"
        />
        <span class="profile__photo-edit" aria-hidden="true"
          ><ion-icon name="camera-outline"></ion-icon
        ></span>
      </label>
      @if (profilePhotoUrl) {
      <div class="profile__photo-actions">
        <ion-button
          class="profile__photo-remove"
          type="button"
          fill="outline"
          [disabled]="photoSaving"
          (click)="removeProfilePhoto()"
        >
          Rimuovi
        </ion-button>
      </div>
      }
      <p class="profile__photo-hint">JPEG, PNG o WebP · massimo 2 MB</p>
      @if (photoError) {
      <p class="profile__photo-error" role="alert">{{ photoError }}</p>
      }
      <h2 id="profile-user-name" class="profile__name">{{user.fullName}}</h2>
      <p class="profile__role">{{user.role}}</p>
      <a class="profile__email" [href]="'mailto:' + user.email"
        >{{user.email}}</a
      >
    </section>

    <nav class="profile-menu" aria-label="Impostazioni del profilo">
      <app-theme-toggle [showLabel]="true"></app-theme-toggle>
      <ion-list class="profile-menu__list">
        <ion-item class="profile-menu__item" routerLink="/profile/password" [button]="true" [detail]="true">
          Cambia password
        </ion-item>
        @if (!auth.isAdmin()) {
        <ion-item class="profile-menu__item" routerLink="/reports" [button]="true" [detail]="true">
          Le mie segnalazioni
        </ion-item>
        <ion-item class="profile-menu__item" routerLink="/profile/delete" [button]="true" [detail]="true">
          Elimina account
        </ion-item>
        }
      </ion-list>
    </nav>

    <ion-button
      class="profile__logout"
      type="button"
      fill="outline"
      expand="block"
      (click)="logout()"
      [disabled]="auth.signingOut()"
    >
      {{ auth.signingOut() ? 'Uscita in corso…' : 'Esci' }}
    </ion-button>
  </main>
</ion-content>
