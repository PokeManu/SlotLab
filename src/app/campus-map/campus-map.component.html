<section
  class="campus-map"
  aria-labelledby="campus-map-title"
>
  <header class="campus-map__header">
    <div>
      @if (eyebrow) {
        <p class="campus-map__eyebrow">
          {{ eyebrow }}
        </p>
      }

      <h2 id="campus-map-title">
        {{ heading }}
      </h2>
    </div>

    <p class="campus-map__hint">
      {{ hint }}
    </p>
  </header>

  @if (loading) {
    <p class="campus-map__state" role="status">Caricamento edifici…</p>
  } @else if (error) {
    <p class="campus-map__state campus-map__state--error" role="alert">{{ error }}</p>
  } @else if (!buildings.length) {
    <p class="campus-map__state" role="status">Nessun edificio disponibile.</p>
  }

  <div
    #mapContainer
    class="campus-map__canvas"
    aria-label="Mappa interattiva degli edifici universitari"
  ></div>
</section>
