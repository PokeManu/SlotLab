<section
  class="campus-map"
  aria-labelledby="campus-map-title"
>
  <header class="campus-map__header">
    <div>
      @if (eyebrow) {
        <p class="campus-map__eyebrow">
          {{ eyebrow }}
        </p>
      }

      <h2 id="campus-map-title">
        {{ heading }}
      </h2>
    </div>

    <p class="campus-map__hint">
      {{ hint }}
    </p>
  </header>

  <div
    id="campus-map"
    class="campus-map__canvas"
    aria-label="Mappa interattiva degli edifici universitari"
  ></div>
</section>
