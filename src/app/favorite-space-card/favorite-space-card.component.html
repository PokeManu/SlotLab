<ion-card class="favorite-space-card">
  <div class="favorite-space-card__icon" aria-hidden="true">
    <ion-icon [name]="iconName"></ion-icon>
  </div>

  <ion-card-content class="favorite-space-card__content">
    <h2 class="favorite-space-card__name">
      {{ space.name }}
    </h2>

    <p class="favorite-space-card__location">
      {{ space.building }}
      <span aria-hidden="true">·</span>
      piano {{ space.floor }}
    </p>

    <p class="favorite-space-card__capacity">
      Capacità:
      {{ space.seats }}
      {{ space.type === "Laboratorio" ? "postazioni" : "posti" }}
    </p>

    <p
      class="favorite-space-card__availability"
      [class.favorite-space-card__availability--warning]="
        space.availabilityTone === 'warning'
      "
    >
      <span class="favorite-space-card__status-dot" aria-hidden="true"></span>

      {{ space.availability }}
    </p>
  </ion-card-content>

  <div class="favorite-space-card__actions">
    <ion-button
      class="favorite-space-card__favorite"
      type="button"
      fill="clear"
      [attr.aria-label]="'Rimuovi ' + space.name + ' dai preferiti'"
      aria-pressed="true"
      (click)="removeFavorite()"
    >
      <ion-icon slot="icon-only" name="heart" aria-hidden="true"></ion-icon>
    </ion-button>

    <ion-button
      class="favorite-space-card__action"
      type="button"
      fill="clear"
      [attr.aria-label]="'Apri ' + space.name"
      (click)="openSpace()"
    >
      <ion-icon
        slot="icon-only"
        name="arrow-forward-outline"
        aria-hidden="true"
      ></ion-icon>
    </ion-button>
  </div>
</ion-card>
