<div
  class="quick-filters"
  role="group"
  aria-label="Filtri rapidi"
>
  @for (filter of filters; track filter.id) {
    <button
      class="quick-filters__button"
      type="button"
      [class.quick-filters__button--active]="filter.active"
      [class.quick-filters__button--desktop-only]="filter.desktopOnly"
      [class.quick-filters__button--mobile-only]="filter.mobileOnly"
      [attr.aria-pressed]="filter.active"
      (click)="toggleFilter(filter)"
    >
      <span class="quick-filters__label-desktop">
        {{ filter.label }}
      </span>

      <span class="quick-filters__label-mobile">
        {{ filter.mobileLabel ?? filter.label }}
      </span>
    </button>
  }
</div>
