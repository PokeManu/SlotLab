<section class="filters" aria-label="Filtri delle prenotazioni">
  <div class="search-field" role="search">
    <ion-searchbar
      placeholder="Cerca per spazio o utente"
      aria-label="Cerca per spazio, utente o codice"
      autocomplete="off"
      [value]="searchTerm"
      (ionInput)="searchTermChange.emit($event.detail.value ?? ''); changed.emit()"
    ></ion-searchbar>
  </div>

  <div class="filters__selects">
    <div class="select-field">
      <ion-select
        interface="popover"
        aria-label="Filtra per data"
        [value]="selectedDate"
        (ionChange)="selectedDateChange.emit($event.detail.value ?? ''); changed.emit()"
      >
        <ion-select-option value="">Data</ion-select-option>
        @for (date of availableDates; track date) {
          <ion-select-option [value]="date">
            {{ date | date: "dd/MM/yyyy" }}
          </ion-select-option>
        }
      </ion-select>
    </div>

    <div class="select-field">
      <ion-select
        interface="popover"
        aria-label="Filtra per spazio"
        [value]="selectedSpace"
        (ionChange)="selectedSpaceChange.emit($event.detail.value ?? ''); changed.emit()"
      >
        <ion-select-option value="">Spazio</ion-select-option>

        @for (space of availableSpaces; track space) {
          <ion-select-option [value]="space">{{ space }}</ion-select-option>
        }
      </ion-select>
    </div>

    <div class="select-field">
      <ion-select
        interface="popover"
        aria-label="Filtra per stato"
        [value]="selectedStatus"
        (ionChange)="selectedStatusChange.emit($event.detail.value ?? ''); changed.emit()"
      >
        <ion-select-option value="">Stato</ion-select-option>
        <ion-select-option value="Confermata">Confermata</ion-select-option>
        <ion-select-option value="Completata">Completata</ion-select-option>
      </ion-select>
    </div>
  </div>
</section>
