<section
          class="filters"
          aria-label="Filtri delle prenotazioni"
        >
          <label class="search-field">
            <ion-icon name="search-outline"></ion-icon>

            <input
              type="search"
              placeholder="Cerca per spazio o utente"
              aria-label="Cerca per spazio, utente o codice"
              [ngModel]="searchTerm" (ngModelChange)="searchTermChange.emit($event); changed.emit()"
            />
          </label>

          <div class="filters__selects">
            <label class="select-field">
              <span class="sr-only">Filtra per data</span>

              <select
                [ngModel]="selectedDate" (ngModelChange)="selectedDateChange.emit($event); changed.emit()"
              >
                <option value="">Data</option>
                <option value="2026-08-31">Oggi</option>
                <option value="2026-09-01">Domani</option>
              </select>

              <ion-icon name="chevron-down-outline"></ion-icon>
            </label>

            <label class="select-field">
              <span class="sr-only">Filtra per spazio</span>

              <select
                [ngModel]="selectedSpace" (ngModelChange)="selectedSpaceChange.emit($event); changed.emit()"
              >
                <option value="">Spazio</option>

                @for (space of availableSpaces; track space) {
                  <option [value]="space">{{ space }}</option>
                }
              </select>

              <ion-icon name="chevron-down-outline"></ion-icon>
            </label>

            <label class="select-field">
              <span class="sr-only">Filtra per stato</span>

              <select
                [ngModel]="selectedStatus" (ngModelChange)="selectedStatusChange.emit($event); changed.emit()"
              >
                <option value="">Stato</option>
                <option value="Confermata">Confermata</option>
                <option value="Check-in">Check-in</option>
                <option value="Annullata">Annullata</option>
              </select>

              <ion-icon name="chevron-down-outline"></ion-icon>
            </label>
          </div>
        </section>
