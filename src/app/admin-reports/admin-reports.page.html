<ion-content [fullscreen]="true" class="admin-content">
  <div class="admin-shell">
    <app-admin-sidebar></app-admin-sidebar>

    <main class="report-management">
      <header class="reports-header">
        <h1>Segnalazioni</h1>
      </header>

      <nav class="report-filters" aria-label="Filtra le segnalazioni">
        <button type="button" [class.report-filter--active] = "activeFilter === 'all'" (click)="setFilter('all')">
          Tutte
        </button>

        <button type="button" [class.report-filter--active]="activeFilter === 'open'" (click)="setFilter('open')">
          Aperte
        </button>

        <button type="button" [class.report-filter--active]="activeFilter === 'in-progress'" (click)="setFilter('in-progress')">
          In lavorazione
        </button>

        <button type="button" [class.report-filter--active]="activeFilter === 'resolved'" (click)="setFilter('resolved')">
          Risolte
        </button>
      </nav>

      <section class="reports-layout">
        <div class="reports-list" aria-label="Elenco delle segnalazioni">
          @for (report of filteredReports; track report.id){
            <button type="button"
                    class="report-item"
                    [class.report-item--selected]="selectedReport.id === report.id"
                    (click)="selectReport(report)">
              <span class="report-item__icon"
                    [class.report-item__icon--high]="report.priority === 'high'"
                    [class.report-item__icon--medium]="report.priority === 'medium'"
                    [class.report-item__icon--low]="report.priority === 'low'">
                <ion-icon [name]="report.icon"></ion-icon>
              </span>

              <span class="report-item__information">
                <strong>{{report.title}}</strong>
                <small>{{report.space}}</small>
                <small>{{report.date}}</small>
              </span>

              <span class="priority-pill"
                    [class.priority-pill--high]="report.priority === 'high'"
                    [class.priority-pill--medium]="report.priority === 'medium'"
                    [class.priority-pill--low]="report.priority === 'low'">
              {{ report.priorityLabel}}
              </span>
            </button>
          } @empty{
            <p class="empty-reports">
              Non sono presenti segnalazioni per questo filtro
            </p>
          }
        </div>

        <app-report-detail [selectedReport]="selectedReport"></app-report-detail>
      </section>
    </main>
  </div>
</ion-content>
