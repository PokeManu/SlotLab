<ion-content [fullscreen]="true">
  <app-topbar></app-topbar>

  <main class="home">
    <section class="home__intro">
      <div class="home__heading">
        <p class="home__greeting">Ciao Francesco</p>
        <h1>Trova il tuo spazio</h1>
      </div>

      <p class="home__context">
        Campus di Viale delle Scienze
        <span aria-hidden="true">·</span>
        Martedì 18 Agosto
      </p>
    </section>

    <app-space-search></app-space-search>
    <app-quick-filters></app-quick-filters>

    <section class="home__overview" aria-label="Mappa e prossima prenotazione">

      <app-campus-map></app-campus-map>

      <app-next-booking [booking]="nextBooking"></app-next-booking>

    </section>

    <section class="recommended-spaces" aria-labelledby="recommended-spaces-title">
      <header class="recommended-spaces__header">
        <h2 id="recommended-spaces-title">
          Spazi consigliati
        </h2>
      </header>

      <div class="recommended-spaces__grid">
        @for (space of recommendedSpaces; track space.id) {
        <app-space-card
        [space]="space"
        (spaceOpened)="openSpace($event)"></app-space-card>
        }
      </div>
    </section>
  </main>


</ion-content>
