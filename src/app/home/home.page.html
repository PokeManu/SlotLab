<ion-content [fullscreen]="true">
  <app-topbar></app-topbar>

  <main class="home">
    <section class="home__intro">
      <div class="home__heading">
        <p class="home__greeting">Ciao {{ auth.user()?.firstName }}</p>
        <h1>Il tuo campus</h1>
      </div>

      <p class="home__context">
        Campus di Viale delle Scienze
        <span aria-hidden="true">·</span>
        Martedì 18 Agosto
      </p>
    </section>

    <section
      class="recommended-spaces"
      aria-labelledby="recommended-spaces-title"
    >
      <header class="recommended-spaces__header">
        <h2 id="recommended-spaces-title">
          Spazi consigliati
        </h2>

        <button class="recommended-spaces__all" type="button" (click)="openAllSpaces()">
          Vedi tutti
        </button>
      </header>

      <div class="recommended-spaces__grid">
        @for (space of recommendedSpaces; track space.id) {
          <app-space-card
            [space]="space"
            (spaceOpened)="openSpace($event)"
          ></app-space-card>
        }
      </div>
    </section>

    <section
      class="home__overview"
      aria-label="Mappa e prossima prenotazione"
    >
      <app-campus-map></app-campus-map>

      @if (nextBooking) {
        <app-next-booking [booking]="nextBooking" (bookingOpened)="openBooking($event)"></app-next-booking>
      } @else {
        <p>Nessuna prenotazione imminente.</p>
      }
    </section>
  </main>
</ion-content>

<app-mobile-navigation></app-mobile-navigation>
