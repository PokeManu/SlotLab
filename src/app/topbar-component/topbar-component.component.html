<header class="topbar" [class.topbar--admin]="auth.isAdmin()">
  <div class="topbar__brand">
    <span class="topbar__logo">
      <ion-icon name="calendar-clear-outline"></ion-icon>
    </span>

    <span class="topbar__brand-name">
      SlotLab
    </span>
  </div>

  <nav
    class="topbar__navigation"
    aria-label="Navigazione principale"
  >
    @if (auth.isAdmin()) {
      @for (item of adminNavigation; track item.route) {
        <a class="topbar__link" [routerLink]="item.route" routerLinkActive="topbar__link--active"
          [routerLinkActiveOptions]="{ exact: item.route === '/admin' }">{{ item.label }}</a>
      }
    } @else {
    <a
      class="topbar__link"
      routerLink="/home"
      routerLinkActive="topbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      Home
    </a>

    <a
      class="topbar__link"
      routerLink="/spaces"
      routerLinkActive="topbar__link--active"
    >
      Spazi
    </a>

    <a
      class="topbar__link"
      routerLink="/bookings"
      routerLinkActive="topbar__link--active"
    >
      Prenotazioni
    </a>

    <a
      class="topbar__link"
      routerLink="/favorites"
      routerLinkActive="topbar__link--active"
    >
      Preferiti
    </a>
    }
  </nav>

  <div class="topbar__user">
  @if (!auth.isAdmin()) {
  <a
    class="topbar__notification"
    routerLink="/notifications"
    routerLinkActive="topbar__notification--active"
    aria-label="Apri le notifiche"
  >
    <ion-icon name="notifications-outline"></ion-icon>
  </a>
  }

    <a
      class="topbar__profile"
      routerLink="/profile"
      routerLinkActive="topbar__profile--active"
      [attr.aria-label]="'Apri il profilo di ' + auth.user()?.firstName"
    >
      <span class="topbar__avatar">
        {{ auth.initials }}
      </span>

      <span class="topbar__username">
        {{ auth.user()?.firstName }}
      </span>
    </a>
  </div>
</header>
